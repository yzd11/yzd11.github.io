# Butterfly 主题配置，未写的项沿用主题默认值

nav:
  display_title: true
  display_post_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-user

code_blocks:
  theme: light
  macStyle: false
  height_limit: 400
  copy: true
  language: true
  shrink: false

# 侧栏不放社交图标，GitHub 链接在“关于”页
social:

favicon: /img/favicon.png
avatar:
  img: /img/avatar.jpg
  effect: false

# 不显示顶部横幅
disable_top_img: true
footer_img: false

# 首页和侧栏只显示文字，不显示封面图
cover:
  index_enable: false
  aside_enable: false
  archives_enable: false

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: false
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

subtitle:
  enable: false

index_layout: 1
index_post_content:
  method: 2

toc:
  post: true
  number: false
  expand: true
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: false
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

related_post:
  enable: true
  limit: 6

footer:
  owner:
    enable: true
    since: 2024
  copyright:
    enable: false

aside:
  enable: true
  mobile: true
  position: left
  card_author:
    enable: true
    description:
    button:
      enable: false
  card_announcement:
    enable: false
  card_recent_post:
    enable: false
    limit: 5
  card_categories:
    enable: true
  card_tags:
    enable: true
    color: false
  card_archives:
    enable: false
    limit: 6
  card_post_series:
    enable: false
  card_webinfo:
    enable: false
    post_count: true
    last_push_date: true

darkmode:
  enable: true
  button: true
  autoChangeMode: 1

anchor:
  auto_update: true

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

math:
  use: katex
  per_page: true

search:
  use: local_search
  placeholder: 搜索文章
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false

lightbox: medium_zoom

theme_color:
  enable: true
  main: "#111111"
  paginator: "#111111"
  button_hover: "#111111"
  text_selection: "#111111"
  link_color: "#111111"
  meta_color: "#8c8c8c"
  hr_color: "#e5e5e5"
  code_foreground: "#111111"
  code_background: "rgba(0, 0, 0, .05)"
  toc_color: "#111111"
  blockquote_padding_color: "#111111"
  blockquote_background_color: "#111111"
  scrollbar_color: "#cccccc"
  meta_theme_color_light: "#ffffff"
  meta_theme_color_dark: "#0a0a0a"

rounded_corners_ui: false
enter_transitions: false

font:
  global_font_size: 16px
  font_family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif

inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">

CDN:
  internal_provider: local
  third_party_provider: local
  version: true

hr_icon:
  enable: false

readmode: false
